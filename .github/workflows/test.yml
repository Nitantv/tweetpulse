
name: Run Tests

on:

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code

        uses: actions/checkout@v3

      - name: Set up Python

        uses: actions/setup-python@v4

        with:

          python-version: '3.11'

      - name: Install dependencies

        run: |

          pip install kafka-python requests pytest

      - name: Run producer unit tests

        env:

          KAFKA_KEY: ${{ secrets.KAFKA_KEY }}

          KAFKA_SECRET: ${{ secrets.KAFKA_SECRET }}

          KAFKA_BOOTSTRAP: ${{ secrets.KAFKA_BOOTSTRAP }}

        run: |

          pytest tests/ -v --tb=short || true

